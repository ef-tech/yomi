# この `name` は dependabot-lockfile.yml の `workflow_run.workflows` から
# **文字列で参照されている**。変えるとあちらが起動しなくなり、dependabot の PR が
# lockfile 未更新のまま落ち続ける (エラーも出ずに黙って止まる) ので、両方を揃えて変えること。
name: CI

on:
  push:
    branches: [main]
  pull_request:
    # **`edited` を拾う。** 検証証跡の検査は `github.event.pull_request.body` を読むので、
    # 既定のトリガー (opened / synchronize / reopened) だけだと**本文を直しても再判定されない**
    # —— しかも `gh run rerun` は同じ event payload を replay するので、**古い本文のまま
    # また落ちる**。落とされた人が直す手段が「空コミットを積む」しか無くなるのを避ける。
    # 重い `test` / `e2e` は下の `if` で `edited` を弾くので、本文の編集で回るのは証跡検査だけ。
    types: [opened, synchronize, reopened, edited]

# パイプの途中の失敗を握り潰さない (GitHub の既定は bash -e で pipefail が付かない)。
# step 側に shell: を書くとここが上書きされるので注意。
defaults:
  run:
    shell: bash --noprofile --norc -eo pipefail {0}

# **concurrency は job 単位に置く。** workflow レベルに置くと、**run 全体が 1 つのロックを取る**ので、
# `edited`（PR 本文の編集）で走った run が**走行中の push run を丸ごと打ち切る**。しかも `edited` の run は
# 下の `if` で test / e2e を skip するので、**実テストが 1 度も走っていないのに「成功した run」が最新になる**
# （実測: run 33605377300 が push の 23 秒後に cancel され、代わりに test/e2e を skip した run が success で残った）。
# job 単位なら **skip された job はロックを取らない**ので、証跡検査だけが打ち切り合いをする。

permissions:
  contents: read

jobs:
  # **本文の編集 (`edited`) では走らせない。** 拾っているのは証跡検査のためだけで、
  # 説明文を直すたびに matrix 2 本と E2E を回すのは無駄。
  test:
    name: Test (${{ matrix.os }})
    if: github.event.action != 'edited'
    # **ジョブごとに別のロック。** 本文の編集で走った run に打ち切られないようにする
    concurrency:
      group: ci-test-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # vendor bundle の鮮度検証 (git diff --exit-code) を決定的にするため patch まで固定。
          # dompurify/mermaid を更新したら bun run build で再生成しコミットする (README 参照)。
          # **dependabot-lockfile.yml と同じ版に揃える** — 版がずれると生成される
          # bun.lock が食い違い、追記した直後にこの --frozen-lockfile がまた落ちる。
          bun-version: "1.3.12"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Issue #52: vendor bundle (DOMPurify / Mermaid) の健全性と鮮度を検証する。
      # build-vendor.ts が CDN 参照・余計なチャンクの残存を検出して throw する。
      # さらに、コミット済みの public/vendor が固定 bun での再ビルド結果とバイト一致する
      # ことを git diff --exit-code で検証する。これにより (a) 依存 bump 時の再生成忘れ
      # (例: dependabot が dompurify/mermaid を上げるが vendor 未再ビルド → 陳腐化/CVE 版が
      # 配布される) と (b) 生成物の改竄 を検出する。bun 版を固定してビルドを決定的にし、
      # cross-OS の minifier 差を避けるため厳密比較は ubuntu-latest のみで行う。
      - name: Build & verify vendor bundle
        run: |
          bun run build
          if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            git diff --exit-code -- public/vendor || {
              echo "::error::public/vendor がコミット済みと固定 bun での再ビルド結果で不一致です。dompurify/mermaid を更新したら 'bun run build' を実行してコミットしてください。"
              exit 1
            }
          fi

      - name: Lint & format check
        run: bun run lint

      - name: Type check
        run: bun run typecheck

      - name: Run tests
        run: bun test


  # ブラウザ E2E (Issue #80)。
  #
  # **test ジョブとは分ける。** Playwright のブラウザ導入だけで 100MB 超・数十秒かかるので、
  # ユニットテストのフィードバックを遅らせない。E2E が落ちても test の結果は独立して読める。
  #
  # **ubuntu のみで走らせる。** E2E が守るのは「実ブラウザでしか出ない結合」であって
  # OS 差ではない。macOS でも回すと CI 時間が倍になるうえ、#45 で踏んだ macOS 固有の
  # flaky を E2E でも抱え込むことになる。OS 差はユニット側の matrix が見ている。
  e2e:
    name: E2E (chromium)
    if: github.event.action != 'edited'
    concurrency:
      group: ci-e2e-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    # ブラウザバイナリの download や bun install が詰まったときに 6 時間走らせない
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # test ジョブと同じ版に揃える (ずれると bun.lock の検証が食い違う)
          bun-version: "1.3.12"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # vendor bundle は配布物に同梱されているが、リポジトリには生成物がコミット済みなので
      # E2E ではビルドし直さない (test ジョブが鮮度を検証している)。

      # ブラウザバイナリは版ごとにキャッシュする。@playwright/test を bump したら
      # キーが変わって取り直される。
      #
      # **版取得は失敗したら落とす。** 既定シェルは `bash -e` で pipefail が付かないので、
      # 出力形式が変わって grep が空振りしても step は成功し、`playwright-Linux-` という
      # 空版キーが保存される。restore-keys が無いため以後 bump してもそのキーに当たり続け、
      # ブラウザが入らないまま E2E が落ち続ける (原因に辿り着きにくい)。
      - name: Get Playwright version
        id: pw
        shell: bash
        run: |
          set -euo pipefail
          version="$(bunx playwright --version | grep -oP '[0-9]+\.[0-9]+\.[0-9]+')"
          [ -n "$version" ] || { echo "::error::Playwright の版を取得できませんでした"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # arch とイメージ版もキーに入れる。runner.os は "Linux" としか出ないので、
      # ubuntu-latest が次の LTS へ切り替わったとき古いイメージ用のキャッシュを引き継いでしまう。
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ env.ImageOS }}-${{ steps.pw.outputs.version }}

      # **cache-hit で分岐しない。** `--with-deps` はブラウザが既にあれば download を
      # スキップして apt の依存だけ入れるので 1 step で足りる。分岐させると、install が
      # 途中で失敗した run のキャッシュが保存されたときに以後ずっと install がスキップされ、
      # 壊れたキャッシュから自力で回復できなくなる。
      #
      # chromium だけ入れる。firefox / webkit は「実ブラウザでしか出ない結合」を見るのに
      # 必須ではなく、導入時間と flaky を増やすだけ (必要になったら別 Issue)。
      - name: Install Chromium (+ system deps)
        run: bunx playwright install --with-deps chromium

      - name: Run E2E
        run: bun run test:e2e

      # 失敗時の screenshot / trace を持ち帰る (DoD)。trace は
      # `npx playwright show-trace <zip>` で操作を再生できる。
      - name: Upload E2E artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # PR 本文の検証証跡（ef:verify-evidence マーカー + 非空 3 行）を検査する。
  #
  # **独立したジョブにする。** 判定材料は `github.event.pull_request.body` だけで、
  # チェックアウトも bun も要らない。`test` の中に置くと、本文を直したときに
  # matrix 2 本ぶんの重いテストまで巻き添えで回ることになる。
  #
  # 判定の実体は .github/scripts/check-pr-evidence.sh（ef-devkit の正本のコピー）。
  # bot の PR は証跡を持たないので除外する（除外しないと dependabot が必ず red になる）。
  evidence:
    name: PR verification evidence
    if: github.event_name == 'pull_request' && github.event.pull_request.user.type != 'Bot'
    # ここだけは本文を編集するたびに打ち切り合ってよい（判定材料が本文そのものなので、最新だけが要る）
    concurrency:
      group: ci-evidence-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check PR body
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          if [ ! -f .github/scripts/check-pr-evidence.sh ]; then
            echo "ERROR: .github/scripts/check-pr-evidence.sh がありません。" >&2
            echo "ef-devkit の templates/_common/github/scripts/ から配置してください" >&2
            echo "(/ef:bootstrap が CI と 1 セットで置きます)。" >&2
            exit 1
          fi
          printf '%s' "$PR_BODY" | bash .github/scripts/check-pr-evidence.sh
