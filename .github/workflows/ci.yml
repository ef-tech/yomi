name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同じブランチへの push が連続したとき、走行中のジョブはキャンセル (PR は最新のみ)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Issue #52: vendor bundle (DOMPurify / Mermaid) のビルド健全性を検証する。
      # build-vendor.ts が CDN 参照・余計なチャンクの残存を検出して throw する。
      # 生成物の未コミット/欠落も検出する (minifier のパッチ版差によるバイト差は許容し、
      # 依存 bump 時の再ビルド忘れは vendor-bundle テストの版数一致で検出)。
      - name: Build & verify vendor bundle
        run: |
          bun run build
          if git status --porcelain public/vendor | grep -E '^\?\?|^.?D'; then
            echo "::error::public/vendor に未コミット/欠落の生成物があります。'bun run build' 後にコミットしてください。"
            exit 1
          fi

      - name: Lint & format check
        run: bun run lint

      - name: Type check
        run: bun run typecheck

      - name: Run tests
        run: bun test
