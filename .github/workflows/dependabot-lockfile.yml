name: Dependabot generated files

# dependabot は package.json しか書き換えないため、生成物が古いまま残って CI が必ず落ちる。
# ここで生成物を作り直して dependabot の PR に追記し、そのまま green にできるようにする。
# 対象は 2 つ:
#
# 1. **bun.lock** — dependabot は更新できないので `bun install --frozen-lockfile` が落ちる (Issue #72)
# 2. **public/vendor/*.js** — dompurify / mermaid を上げても再ビルドされないので、
#    ci.yml の vendor 鮮度検証 (`bun run build` + `git diff --exit-code`) が落ちる (Issue #75)。
#    dompurify は**プレビューのサニタイザ** (Issue #21 / #59) なので、CVE が出たときに
#    素早く上げたい依存でありながら、いちばん手作業を要求する状態になっていた
#
# **ファイル名と secret 名に "lockfile" が残っている理由**
# 責務が 2 つになったので表示名 (name) と job id は実態に合わせたが、ファイル名
# `dependabot-lockfile.yml` と secret 名 `DEPENDABOT_LOCKFILE_TOKEN` はそのままにしている。
# secret 名を変えると登録済みの PAT を人が入れ直すまでワークフローが止まるため
# (README のセットアップ手順もやり直しになる)、名前の綺麗さに見合わない。
#
# **なぜ workflow_run なのか**
# dependabot が起こした pull_request / pull_request_target の GITHUB_TOKEN は
# read-only に固定され、`permissions:` で昇格できない (fork PR と同じ扱い)。
# workflow_run は既定ブランチのコンテキストで動くのでこの制限を受けず、通常の
# Actions secrets と write 権限を使える。
#
# **なぜ PAT が要るのか**
# GITHUB_TOKEN で push すると、その PR の check は approval-required 状態で
# 止まり、人が UI で承認するまで required status checks が進まない。PAT で
# push すれば通常の synchronize として CI が走り、そのまま green にできる。
#
# **必要な準備 (人間の作業)**
# fine-grained PAT (このリポジトリの Contents: Read and write) を発行し、
# **Actions secrets** に `DEPENDABOT_LOCKFILE_TOKEN` として登録する。
# Dependabot secrets ではない — このワークフローは dependabot コンテキストで
# 動かないため、通常の Actions secrets を読む。手順は README の「開発」を参照。
#
# **採らなかった案**
# - CI 側で dependabot PR だけ --frozen-lockfile を外す: PR は通るが main の
#   lockfile が package.json と食い違ったまま残り、次の通常 PR が落ちる
# - main へ直接 lockfile を push する: ブランチ保護 (required status checks)
#   に阻まれる
# - Renovate へ移行する: bun.lock をネイティブに扱えるが、移行そのものが
#   この Issue のスコープを超える

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read # 実際の push は PAT で行うので GITHUB_TOKEN に write は要らない

# 同じ dependabot ブランチで CI が続けて走ったとき (rebase・force-push) に、
# 2 つのジョブが同じブランチへ push し合って non-fast-forward で落ちるのを避ける。
# キャンセルはしない — 走っている追記を途中で止めると生成物が中途半端に残る。
concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  sync-generated:
    # dependabot の PR に対する CI の完了だけを拾う。PAT で push し直した後の
    # 実行は actor が変わるため再入しないが、下の差分判定でも二重に止めている。
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]' &&
      startsWith(github.event.workflow_run.head_branch, 'dependabot/')
    runs-on: ubuntu-latest
    env:
      # run: のシェルへ ${{ }} を直接埋めず、env 経由で渡す (ブランチ名は外部入力)
      BRANCH: ${{ github.event.workflow_run.head_branch }}
      TOKEN: ${{ secrets.DEPENDABOT_LOCKFILE_TOKEN }}
    steps:
      - name: PAT の登録を確認する
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Actions secret DEPENDABOT_LOCKFILE_TOKEN が未登録です。fine-grained PAT (このリポジトリの Contents: Read and write) を発行し、Actions secrets に登録してください (README の「開発」を参照)。"
            exit 1
          fi

      - name: Checkout dependabot branch
        uses: actions/checkout@v7
        with:
          ref: ${{ env.BRANCH }}
          token: ${{ env.TOKEN }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # ci.yml と同じ版に固定する。版がずれると (a) 生成される bun.lock が食い違って
          # 追記した直後の CI がまた --frozen-lockfile で落ち、(b) vendor bundle のバイトが
          # 変わって ci.yml の `git diff --exit-code -- public/vendor` が落ちる。
          # **ci.yml の bun-version と必ず揃えること。**
          bun-version: "1.3.12"

      # --ignore-scripts: PAT を持った環境で依存の lifecycle script を実行しない
      # (更新先パッケージ経由の任意コード実行を避ける)。lockfile は依存解決の
      # 結果なので、スクリプトを走らせなくても内容は変わらない。
      - name: Install dependencies
        run: bun install --ignore-scripts

      # 更新対象が dompurify / mermaid かを package.json の diff で判定する条件分岐は入れない。
      # グループ更新やインデントの揺れで壊れるので、**常に生成して差分の有無で判断する**ほうが確実。
      # `bun run build` 自体は ci.yml も毎回実行しているコストで、数秒で終わる。
      #
      # ここで依存のコードが実行されることはない。build-vendor.ts が使う Bun.build は
      # node_modules/{dompurify,mermaid} を**構文解析して bundle するだけ**で評価しないため、
      # --ignore-scripts と合わせて「更新先パッケージのコードは一切走らない」が保たれる。
      - name: Rebuild vendor bundle
        run: bun run build

      # bun.lock と public/vendor を **1 コミットにまとめる**。分けると「lockfile だけ新しく
      # vendor が古い」中間コミットができ、それはまさに ci.yml の鮮度検証が落とす状態になる。
      # 依存更新 1 回に対する生成物はアトミックに入れる。
      - name: Commit and push if changed
        run: |
          if git diff --quiet -- bun.lock public/vendor; then
            echo "bun.lock / public/vendor はどちらも最新です。追記しません"
            exit 0
          fi
          git diff --stat -- bun.lock public/vendor
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 変更が無いほうは何も stage されないので、余計なファイルは入らない
          # (例: jsdom の更新なら bun.lock だけのコミットになる)
          git add bun.lock public/vendor
          git commit -m "chore: 📦 dependabot の更新に合わせて生成物を再生成"
          git push origin "HEAD:$BRANCH"
